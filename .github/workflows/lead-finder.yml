name: Find Ufa cleaning leads

# Расписание (cron) GitHub запускает только для workflow из основной ветки (main).
# На pull_request выполняется ТОЛЬКО job test: реальный поиск на PR не запускается.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run lead-finder tests
        working-directory: backend
        run: python -m pytest -q tests/test_lead_finder.py

  search:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: lead-finder-search
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ссылки, которые уже были в отчёте, хранятся между запусками, чтобы не слать их повторно.
      # Кэш сохраняется только после успешного job: при ошибке отправки в Telegram
      # те же кандидаты придут в следующий раз.
      - name: Restore seen links
        uses: actions/cache@v4
        with:
          path: backend/.lead-finder-seen.json
          key: lead-finder-seen-${{ github.run_id }}
          restore-keys: |
            lead-finder-seen-
      - name: Search public web results
        working-directory: backend
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.LEAD_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.LEAD_TELEGRAM_CHAT_ID }}
          LIMIT: ${{ inputs.limit || '5' }}
        run: |
          args=(--limit "$LIMIT" --output lead-finder-results.json --state .lead-finder-seen.json)
          # Сводка в Telegram только если заданы оба секрета. Значения не выводятся.
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            args+=(--telegram)
          else
            echo "Секреты LEAD_TELEGRAM_BOT_TOKEN / LEAD_TELEGRAM_CHAT_ID не заданы: сводка в Telegram не отправляется."
          fi
          python -m lead_finder.agent "${args[@]}"
      - name: Upload lead report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufa-lead-finder-${{ github.run_id }}
          path: backend/lead-finder-results.json
          if-no-files-found: warn
          retention-days: 7
