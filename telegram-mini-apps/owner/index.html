<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Лакония Клин — панель владельца</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--tg-theme-text-color,#172033);background:var(--tg-theme-bg-color,#f5f7fb);--card:var(--tg-theme-secondary-bg-color,#fff);--muted:var(--tg-theme-hint-color,#778197);--accent:var(--tg-theme-button-color,#2878e8)}
*{box-sizing:border-box}body{margin:0;padding:18px 15px 32px;max-width:720px;margin-inline:auto}.brand{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:800}h1{font-size:27px;margin:7px 0}h2{font-size:18px;margin:23px 2px 9px}p{color:var(--muted);line-height:1.4;margin:6px 0}.notice{padding:11px 13px;border-radius:12px;font-size:13px;margin:15px 0;background:#e8f4ed;color:#197548}.notice.error{background:#ffe8e8;color:#9f2525}.card{background:var(--card);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 5px 24px #1625440a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:27px;font-weight:800;margin-top:8px}.caption,.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.pill{white-space:nowrap;background:#e8f4ed;color:#197548;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}.pill.pending{background:#fff1cf;color:#815500}button{border:0;border-radius:11px;padding:11px;font:inherit;font-weight:700;background:var(--accent);color:var(--tg-theme-button-text-color,#fff);cursor:pointer}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions button{flex:1;font-size:12px;min-width:105px}.secondary{background:transparent;color:var(--accent);border:1px solid #cddcf7}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{font-size:13px}.empty{padding:20px;text-align:center;color:var(--muted)}.footer{font-size:11px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="row"><div><div class="brand">ЛАКОНИЯ КЛИН</div><h1>Панель владельца</h1><p>Заявки из серверной базы</p></div><div style="font-size:30px" aria-hidden="true">🛡️</div></div>
<div id="notice" class="notice">Проверяем авторизацию и загружаем заявки…</div>
<div class="grid">
  <div class="card"><div class="caption">Всего загружено</div><div class="metric" id="total">—</div><p class="small">Последние 500 заявок</p></div>
  <div class="card"><div class="caption">Новые</div><div class="metric" id="newCount">—</div><p class="small">Ожидают обработки</p></div>
</div>
<div class="top-actions"><h2 style="flex:1;margin-top:18px">Заявки</h2><button id="refresh" class="secondary">Обновить</button></div>
<div id="requests"><div class="card empty">Загрузка…</div></div>
<p class="footer">Доступ только для разрешённых Telegram ID. Не передавайте ссылки на панель посторонним.</p>
<script>
(() => {
  const API = 'https://lakoniya-clean.onrender.com';
  const tg = window.Telegram && window.Telegram.WebApp;
  const root = document.getElementById('requests');
  const notice = document.getElementById('notice');
  // "В обработке" and "Передана сотруднику" also send a message to the customer in the customer bot.
  const allowedStatuses = ['Новая', 'В обработке', 'Передана сотруднику', 'Подтверждена', 'В работе', 'Завершена', 'Отменена'];
  if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }

  function setNotice(message, isError=false) {
    notice.textContent = message;
    notice.className = isError ? 'notice error' : 'notice';
  }
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  }
  function dateText(timestamp) {
    if (!timestamp) return 'Дата не указана';
    const date = new Date(Number(timestamp) * 1000);
    return Number.isNaN(date.getTime()) ? 'Дата не указана' : date.toLocaleString('ru-RU');
  }
  async function apiRequest(path, options={}) {
    const initData = tg && tg.initData;
    if (!initData) throw new Error('Откройте панель через кнопку меню бота @LAKONIYABOT в Telegram.');
    const response = await fetch(API + path, {
      ...options,
      headers: {
        'X-Telegram-Init-Data': initData,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    });
    if (response.status === 401) throw new Error('Авторизация не прошла или устарела. Закройте и заново откройте Mini App через Telegram.');
    if (response.status === 403) throw new Error('У этого Telegram-аккаунта нет прав владельца. Проверьте OWNER_TELEGRAM_IDS в Render.');
    if (response.status === 503) throw new Error('Сервер ещё не настроен. Проверьте секреты backend в Render.');
    if (!response.ok) {
      let detail = 'Ошибка сервера (' + response.status + ')';
      try { const data = await response.json(); if (data.detail) detail = String(data.detail); } catch (_) {}
      throw new Error(detail);
    }
    return response.status === 204 ? null : response.json();
  }
  function addField(card, label, value) {
    const p = element('p');
    p.append(element('b', '', label + ': '));
    p.append(document.createTextNode(value || 'Не указано'));
    card.append(p);
  }
  async function changeStatus(id, status, button) {
    button.disabled = true;
    try {
      await apiRequest('/api/requests/' + encodeURIComponent(id) + '/status', {
        method: 'PATCH',
        body: JSON.stringify({status})
      });
      setNotice('Статус заявки №' + id + ' сохранён.');
      await loadRequests(false);
    } catch (error) {
      setNotice(error.message || 'Не удалось изменить статус.', true);
    } finally {
      button.disabled = false;
    }
  }
  function renderRequests(items) {
    root.replaceChildren();
    if (!items.length) {
      root.append(element('div', 'card empty', 'В базе пока нет заявок.'));
      return;
    }
    for (const request of items) {
      const card = element('article', 'card');
      const top = element('div', 'row');
      const title = element('div');
      title.append(element('b', '', 'Заявка №' + request.id));
      title.append(element('p', 'small', dateText(request.created_at)));
      const pill = element('span', 'pill' + (request.status === 'Новая' ? ' pending' : ''), request.status);
      top.append(title, pill);
      card.append(top);
      addField(card, 'Услуга', request.service);
      addField(card, 'Адрес', request.address);
      addField(card, 'Желаемое время', request.preferred_time);
      addField(card, 'Сумма (предварительно)', request.estimated_amount == null
        ? 'не рассчитана'
        : Number(request.estimated_amount).toLocaleString('ru-RU') + ' ₽');
      addField(card, 'Контакт клиента', request.customer_contact);
      if (request.notes) addField(card, 'Комментарий', request.notes);
      const actions = element('div', 'actions');
      for (const status of allowedStatuses) {
        if (status === request.status) continue;
        const button = element('button', status === 'Отменена' ? 'secondary' : '', status);
        button.type = 'button';
        button.addEventListener('click', () => changeStatus(request.id, status, button));
        actions.append(button);
      }
      card.append(actions);
      root.append(card);
    }
  }
  async function loadRequests(showLoading=true) {
    const refresh = document.getElementById('refresh');
    refresh.disabled = true;
    if (showLoading) {
      root.replaceChildren(element('div', 'card empty', 'Загружаем реальные заявки…'));
      setNotice('Проверяем доступ к серверу…');
    }
    try {
      const data = await apiRequest('/api/requests');
      const items = Array.isArray(data.requests) ? data.requests : [];
      document.getElementById('total').textContent = items.length;
      document.getElementById('newCount').textContent = items.filter(item => item.status === 'Новая').length;
      renderRequests(items);
      if (notice.classList.contains('error') || showLoading) setNotice('Подключено к серверу. Показаны данные из базы.');
    } catch (error) {
      root.replaceChildren(element('div', 'card empty', error.message || 'Не удалось загрузить заявки.'));
      setNotice(error.message || 'Не удалось подключиться к API.', true);
      document.getElementById('total').textContent = '—';
      document.getElementById('newCount').textContent = '—';
    } finally {
      refresh.disabled = false;
    }
  }
  document.getElementById('refresh').addEventListener('click', () => loadRequests(true));
  loadRequests(true);
})();
</script>
</body>
</html>
